# Pages CMS (https://pagescms.org) — sign in with GitHub at app.pagescms.org and open this repo.
media:
  input: src/images
  output: /images
content:
  - name: home
    label: Početna
    type: file
    path: src/_data/home.json
    format: json
    fields:
      - name: hero
        label: Naslovni dio
        type: object
        fields:
          - { name: title, label: Naslov, type: string }
          - { name: text, label: Tekst, type: text }
          - { name: button, label: Tekst gumba, type: string }
          - { name: rating_text, label: Tekst ispod zvjezdica, type: string }
          - { name: image, label: Fotografija, type: image }
          - { name: image_alt, label: Opis fotografije, type: string }
      - name: steps
        label: Koraci (Nazovite nas…)
        type: object
        list: true
        fields:
          - { name: icon, label: Ikona, type: select, options: { values: [phone, person, truck] } }
          - { name: title, label: Naslov, type: string }
          - { name: text, label: Tekst, type: text }
      - name: intro
        label: Obiteljski obrt
        type: object
        fields:
          - { name: image, label: Fotografija, type: image }
          - { name: image_label, label: Natpis na fotografiji, type: string }
          - { name: title, label: Naslov, type: string }
          - { name: text, label: Tekst, type: text }
          - { name: points, label: Stavke, type: string, list: true }
      - { name: services_title, label: Usluge – naslov, type: string }
      - { name: services_text, label: Usluge – tekst, type: text }
      - { name: help_title, label: "Potrebna vam je pomoć? – naslov", type: string }
      - { name: faq_title, label: Česta pitanja – naslov, type: string }
      - { name: faq_text, label: Česta pitanja – tekst, type: text }
      - name: faq
        label: Česta pitanja
        type: object
        list: true
        fields:
          - { name: q, label: Pitanje, type: string }
          - { name: a, label: Odgovor, type: text }
      - { name: testimonials_title, label: Recenzije – naslov, type: string }
      - { name: testimonials_text, label: Recenzije – tekst, type: string }
      - name: testimonials
        label: Recenzije
        type: object
        list: true
        fields:
          - { name: name, label: Ime, type: string }
          - { name: stars, label: Zvjezdice (1–5), type: number }
          - { name: photo, label: Fotografija (nije obavezno), type: image }
          - { name: text, label: Recenzija, type: text }

  - name: services
    label: Usluge
    type: collection
    path: src/services
    filename: "{fields.title}.md"
    view:
      fields: [title, summary]
      sort: [order]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Naziv usluge, type: string, required: true }
      - { name: order, label: Redoslijed, type: number }
      - { name: icon, label: Ikona, type: select, options: { values: [thermometer, trending, flame, pipe, snowflake, fan] } }
      - { name: summary, label: Kratki opis, type: text }
      - { name: image, label: Naslovna fotografija, type: image }
      - { name: heading, label: Podnaslov teksta, type: string }
      - { name: body, label: Tekst, type: rich-text }

  - name: about
    label: O nama
    type: file
    path: src/_data/about.json
    format: json
    fields:
      - { name: title, label: Naslov, type: string }
      - { name: text, label: Podnaslov, type: text }
      - { name: hero_image, label: Pozadinska fotografija, type: image }
      - { name: since_image, label: Fotografija (Od 2022), type: image }
      - { name: since_label, label: Natpis iznad godine, type: string }
      - { name: since_year, label: Godina, type: string }
      - { name: why_title, label: "Zašto odabrati – naslov", type: string }
      - { name: why_text, label: "Zašto odabrati – tekst (**podebljano**)", type: text }
      - { name: points, label: Stavke, type: string, list: true }
      - { name: edu_title, label: Edukacija – naslov, type: string }
      - { name: edu_text, label: Edukacija – tekst, type: text }
      - name: cards
        label: Kartice
        type: object
        list: true
        fields:
          - { name: image, label: Fotografija, type: image }
          - { name: title, label: Naslov, type: string }
          - { name: text, label: Tekst, type: text }

  - name: gallery
    label: Galerija
    type: file
    path: src/_data/gallery.json
    format: json
    fields:
      - { name: title, label: Naslov, type: string }
      - { name: text, label: Tekst, type: text }
      - name: images
        label: Fotografije
        type: object
        list: true
        fields:
          - { name: src, label: Fotografija, type: image }
          - { name: alt, label: Opis, type: string }

  - name: contact
    label: Kontakt stranica
    type: file
    path: src/_data/contact.json
    format: json
    fields:
      - { name: title, label: Naslov, type: string }
      - { name: text, label: Podnaslov, type: string }
      - { name: heading, label: Naslov uz obrazac, type: string }
      - { name: body, label: Tekst uz obrazac, type: text }

  - name: servicesPage
    label: Stranica Usluge
    type: file
    path: src/_data/servicesPage.json
    format: json
    fields:
      - { name: title, label: Naslov, type: string }
      - { name: text, label: Tekst, type: text }

  - name: site
    label: Postavke i kontakt podaci
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: name, label: Naziv, type: string }
      - { name: title, label: Naslov stranice (Google), type: string }
      - { name: description, label: Opis stranice (Google), type: text }
      - { name: phone, label: Telefon, type: string }
      - { name: email, label: Email, type: string }
      - { name: city, label: Mjesto, type: string }
      - { name: address, label: Adresa, type: string }
      - { name: tagline, label: Tekst u podnožju, type: text }
      - { name: cta_title, label: Naslov plavog poziva na dnu, type: string }
      - { name: logo_light, label: Logo (bijeli, zaglavlje), type: image }
      - { name: logo_color, label: Logo (u boji, podnožje), type: image }
      - { name: favicon, label: Favicon, type: image }
      - { name: og_image, label: Slika za dijeljenje, type: image }
      - { name: footer_images, label: Fotografije u podnožju, type: image, list: true }
      - name: form
        label: Kontakt obrazac
        type: object
        fields:
          - { name: web3forms_access_key, label: Web3Forms ključ, type: string }
          - { name: success_message, label: Poruka nakon slanja, type: string }
          - { name: space_options, label: Opcije u izborniku, type: string, list: true }
